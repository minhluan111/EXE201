<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon-link" rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yakishime</title>
    <script>
      (function() {
        const host = window.location.hostname.toLowerCase();
        const storedIsComTam = localStorage.getItem("tenant_is_comtam") === "true";
        const isComTam = host.includes("comtam") || storedIsComTam;
        if (isComTam) {
          document.title = "Cơm Tấm Ngọ";
          const fav = document.getElementById("favicon-link");
          if (fav) fav.href = "/assets/comtamno/logo.jpg";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton:wght@400&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
